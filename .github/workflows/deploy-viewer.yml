name: Deploy reconstruction viewer

on:
  workflow_dispatch:
  push:
    branches: [namma-pages-deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextgen/viewer/package-lock.json
      - run: npm ci
        working-directory: nextgen/viewer
      - run: npm run build
        working-directory: nextgen/viewer
        env:
          VITE_STATIC_DEPLOY: '1'
      - name: Download scene bundle from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download viewer-assets --pattern namma-pages-assets.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/namma-pages-assets.tar.gz" -C nextgen/viewer/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nextgen/viewer/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
