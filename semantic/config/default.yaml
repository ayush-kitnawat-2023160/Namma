source:
  nextgen_root: /workspace/nextgen
  semantic_root: /workspace/semantic

semantic:
  # Phase-1 MVP. Expand only after the geometry path is validated.
  min_depth_confidence: 0.20

segmentation:
  # Structural/stuff segmentation uses ADE20K semantics. Grounding DINO finds
  # object boxes and SAM2 turns those boxes into precise instance masks.
  stuff_model: facebook/mask2former-swin-small-ade-semantic
  detector_model: IDEA-Research/grounding-dino-tiny
  sam2_model: facebook/sam2.1-hiera-small

  stuff_classes:
    floor: [floor]
    wall: [wall]
    ceiling: [ceiling]
    pillar: [column, pillar]
    door: [door]

  object_prompts:
    chair: [chair, armchair]
    table: [table, desk]
    sofa: [sofa, couch]
    cabinet: [cabinet, cupboard]
    door: [door]

  box_threshold: 0.30
  text_threshold: 0.25
  nms_iou: 0.55
  min_mask_area: 250
  overlay_alpha: 0.45

  # Keep the global threshold permissive enough for partially occluded chairs
  # and tables, but require stronger evidence for classes that Grounding DINO
  # tends to confuse with large rectangular indoor structures.
  class_score_thresholds:
    door: 0.45

fusion:
  # Stage 2 projects the already Sim(3)-aligned dense VGGT cloud into every
  # BA-refined COLMAP camera, then transfers Stage-1 labels by visibility-aware
  # multi-view voting. The dense cloud was already confidence-filtered in VGGT.
  voxel_size: 0.02
  z_buffer_tolerance: 0.01
  min_semantic_votes: 2
  min_vote_ratio: 0.35
  min_fragment_points: 40
  instance_merge_overlap: 0.15
  instance_merge_min_shared_points: 25
  instance_merge_distance: 0.75
  instance_max_frame_gap: 12
  min_track_views: 2
  min_instance_points: 150
  min_object_point_votes: 2

layout:
  plane_distance_threshold: 0.03
  plane_min_points: 2500
  simplify_tolerance: 0.03
  ransac_iterations: 2500
  max_wall_planes: 8
  wall_vertical_dot_max: 0.35
  ceiling_parallel_dot_min: 0.85
  hull_clip_quantile: 0.995
  pillar_min_points: 300
  pillar_cluster_eps_scale: 8.0
  pillar_dbscan_min_samples: 10

meshing:
  tsdf_voxel_size: 0.01
  tsdf_truncation: 0.04
  confidence_percentile: 20.0
  min_views: 2
  min_mask_pixels: 100
  depth_trunc_quantile: 0.995
  max_volume_resolution: 192
  volume_margin_scale: 0.15
  volume_margin_min: 0.08
  duplicate_overlap_threshold: 0.60
  duplicate_voxel_size: 0.01
  duplicate_centroid_distance: 0.50
  component_min_triangles: 30
  component_min_fraction: 0.005
  max_mesh_triangles: 150000
  collision_max_triangles: 5000

texturing:
  object_texture_resolution: 1024
  architecture_texture_resolution: 2048
  min_incidence: 0.12
  min_projected_area: 2.0
  depth_tolerance_abs: 0.10
  depth_tolerance_rel: 0.05
  architecture_depth_tolerance_abs: 0.16
  architecture_depth_tolerance_rel: 0.08
  atlas_padding: 6
  fallback_color: [160, 160, 160]
  roughness_factor: 0.85
  max_object_views: 120
  max_architecture_views: 120

export:
  primary_format: glb
  keep_individual_objects: true
  write_scene_graph_json: true
